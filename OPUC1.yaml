# One Piece Unlimited Cruise 1 - player YAML
# Change the values after each option name. Every option is set to its default.

name: Player{number}
game: One Piece Unlimited Cruise 1
description: One Piece Unlimited Cruise 1

One Piece Unlimited Cruise 1:
  # ---- Game Options ------------------------------------------------------
  # Starting Character: The Straw Hat you start with. The others are items. "random" picks one.
  # Options: luffy, zoro, usopp, sanji, nami, chopper, robin, franky, brook
  starting_character: luffy

  # Goal: Which boss ends the game. Every island (Wooded Isle, Gorge Isle, Iceberg Isle, Cave Isle and
  # Central Isle) and its bosses are in every seed; islands other than the Wooded Isle open with their
  # island item. god_eneru: "God" Eneru on the Wooded Isle. gecko_moria: Gecko Moria on the Gorge Isle.
  # aokiji: Aokiji on the Iceberg Isle. blackbeard: Blackbeard on the Cave Isle. doom_guardian: the Doom
  # Guardian on Central Isle, behind The Final Door. With any goal but doom_guardian, the Doom Guardian
  # fight is left out (no "The Final Door" item).
  # Options: god_eneru, gecko_moria, aokiji, blackbeard, doom_guardian
  goal: doom_guardian

  # Extra Final Door Requirement: Goal doom_guardian only. What else The Final Door needs (besides its
  # item and its Energy). none: nothing else. island_bosses: every Mid Boss and Island Boss beaten
  # (Kuma, Eneru, Kuro, Krieg, Moria, Wapol, Spandam, Aokiji, Ace, Blackbeard). all_bosses: those and
  # every Secret Boss (Buggy, Nightmare Luffy, Rampaging Chopper, Evil Guardian).
  # Options: none, island_bosses, all_bosses
  extra_final_door_requirement: none

  # Death Link: When any Straw Hat is defeated, everyone else in the multiworld with Death Link on dies
  # too. When someone else dies, the Straw Hat you're controlling takes a fatal hit (the next crew
  # member takes over as usual; a full party wipe still sends you back to the Thousand Sunny).
  # true / false
  death_link: false

  # Falling Causes a Death Link: With Death Link on: falling into the abyss or deep water also sends a
  # death (it only costs some HP in game). Off: only a Straw Hat dying sends one. Does nothing without
  # Death Link.
  # true / false
  falling_death_link: true

  # ---- Gabri Options -----------------------------------------------------
  # Gabri Energy Items: How Gabri's Energy grows. progressive_level: 13 Progressive Gabri Level items,
  # each one a level of the base game (more bars of several colours at once). per_colour: each colour
  # levels up on its own - Progressive Gabri Level (Red / Green / Blue / White / Black / Gold). Gabri
  # starts with 1 Blue bar (enough to leave the Prologue) and nothing else; each colour goes up to 10
  # bars (see How Many Gabri Level Items).
  # Options: progressive_level, per_colour
  gabri_energy_items: progressive_level

  # Starting Gabri Energy: With Gabri Energy Items: per_colour only. The Energy Gabri starts with.
  # vanilla: 3 Blue bars, like the base game (enough for the first real shrine on the Wooded Isle).
  # one_blue_energy: 1 Blue bar (enough to leave the Prologue). all_energy: 1 bar of each of the six
  # Energy types.
  # Options: vanilla, one_blue_energy, all_energy
  starting_gabri_energy: vanilla

  # How Many Gabri Level Items: With Gabri Energy Items: per_colour only. How many items each colour
  # has. 10: each item is one bar (a colour Gabri starts with has fewer items). 5: each item is two bars
  # (the last one only fills a colour up to 10). 15: each item is one bar and every colour goes up to 15
  # bars instead of 10 (shrine costs stay the same). Starting Gabri Energy is taken into account: every
  # colour ends at its cap (10, or 15), never more.
  # Options: 10, 5, 15
  gabri_level_items: '10'

  # Energy Link: Energy Link: Gabri's Energy can be converted into the multiworld's shared Energy Link
  # bank, and withdrawn from it, in the client's Gabri Energy tab (1 Energy = 10 MJ, Gold Energy 20 MJ;
  # converting keeps 80%, a 20% cut). Withdrawing never goes past Gabri's current cap. Off: the tab
  # still shows Gabri's Energy, levels and caps.
  # true / false
  energy_link: false

  # Wherever Cannon Unlock: How the Thousand Sunny's Wherever Cannon is unlocked. build_site: as in the
  # base game - its build site (on the Sunny, once Gorge Isle has been reached) needs the "Thousand
  # Sunny Build Site 1 Access" item, Gabri's Energy and the offered items, and building it is a
  # location. own_item: "The Wherever Cannon" item gives the finished cannon (the game's own build-
  # finished scene plays the next time you're on the Sunny); the build site and its location are gone.
  # start_with: like own_item, but you start with the cannon.
  # Options: build_site, own_item, start_with
  wherever_cannon_unlock: own_item

  # ---- Item Options ------------------------------------------------------
  # Materialsanity: Picking up each natural material for the first time (Bitter Grass, Bamboo, Marble,
  # Iron Scrap ... 40 of them) is a location, named "Got <material>".
  # true / false
  materialsanity: false

  # Early Pickaxe: The Pickaxe is placed early (in the first sphere of the multiworld).
  # true / false
  early_pickaxe: false

  # Early Bug-Catcher Net: The Broken Bug-Catcher Net is placed early (in the first sphere of the
  # multiworld).
  # true / false
  early_bug_catcher_net: false

  # Early Fishing Rod: The Fishing Rod is placed early (in the first sphere of the multiworld).
  # true / false
  early_fishing_rod: false

  # Early Vacuum Cleaner: The first Progressive Vacuum Cleaner is placed early (in the first sphere of
  # the multiworld).
  # true / false
  early_vacuum_cleaner: false

  # Early Bag Upgrade: Progressive Item Bag Upgrades placed early (in the first sphere of the
  # multiworld). none: no early Bag Upgrade. only_one: the first one. both: both.
  # Options: none, only_one, both
  early_bag_upgrade: none

  # Progressive Bag & Palette Item Type: Whether "Progressive Item Bag Upgrade" and "Progressive Palette
  # Upgrade" are Useful or Progression items (progression here is progression that skips balancing).
  # Options: useful, progression
  bag_palette_upgrade_item_type: useful

  # Treasure Maps Require Every Fragment: A treasure map's fragments are only given once every fragment
  # of that map has been received, so its chest can't be dug up until the whole map is found (vanilla:
  # any one fragment is enough).
  # true / false
  treasure_maps_need_every_fragment: false

  # Include Gunpowder Logic: Gunpowder (or Bombs, which work the same way) counts as another way through
  # rock paths (Wooded Isle Part 2 right side, Iceberg Isle's ice rock routes, the way into Cave Isle
  # Part 2, the chests and monument behind rock paths) and to blow open X dig spots (Clay, Marble, Pure
  # Iron Ore, Volcanic Rock). Random plain-ground digs and treasure map chests always need the Pickaxe.
  # Off: only the Pickaxe is expected for any of these.
  # true / false
  include_gunpowder_logic: true

  # Enemy Gunpowder Drop Logic: Whether Gunpowder and Bombs from enemies count for logic (compounding
  # Gunpowder at Chopper's Pharmacy and crafting Bombs at Usopp's Workshop always do). For rock paths
  # and X dig spots it does nothing without Include Gunpowder Logic; it also decides whether enemy drops
  # count for shrine offerings (Gunpowder, Bombs). none: enemy Gunpowder / Bombs are never expected.
  # included: the gunners in Gorge Isle Part 3, Iceberg Isle Part 1 and Cave Isle Part 1 (Gunpowder) and
  # the Knuckle Soldiers in Cave Isle Part 2 (Bombs) count as a source. whirlwind: they count only with
  # Nami and her Whirlwind (to steal them consistently).
  # Options: none, included, whirlwind
  enemy_gunpowder_drop_logic: included

  # Enemy Gunpowder Drop Rate: Chance (%) that the enemies whose common drop is Gunpowder or Bombs (the
  # gunners, and the Knuckle Soldiers on the Cave Isle) drop it when defeated, and that Nami's Whirlwind
  # steals it from them (vanilla: 5% for Pirate and Agent gunners, 4% for Navy gunners; 5 is about
  # vanilla). Cat Burglar multiplies the steal chance (Level 1 x3, Level 2 x4, Level 3 x5), up to 100%.
  # Range: 5-100
  enemy_gunpowder_drop_rate: 20

  # Stack Craftables Make Max Copies: Every stackable item can be held up to 100. Items the game crafts
  # (or hands out) as a full stack - Traps, Flamethrowers, Batteries, Bombs and the powders - normally
  # come in their vanilla amount (for example 10 Traps, 30 Gunpowder, 50 Bombs). With this on, they come
  # as a full stack of 100 instead.
  # true / false
  stack_craftables_make_max_copies: false

  # ---- Crafting Recipe Options -------------------------------------------
  # Usopp's Workshop Unlock Condition: What opens Usopp's Workshop (crafting). start_with: open from the
  # start, no item (like the base game). own_item: the "Usopp's Workshop" item. usopp: having Usopp in
  # the crew, no item. own_item_and_usopp: the item and Usopp.
  # Options: start_with, own_item, usopp, own_item_and_usopp
  workshop_unlock: own_item

  # Usopp Is Required for Art of Development: Art of Development levels are only given once Usopp has
  # joined the crew (received items wait until then).
  # true / false
  usopp_required_for_art: false

  # Sanji's Kitchen Unlock Condition: What opens Sanji's Kitchen (cooking). vanilla: opens after the
  # first island boss you beat, like the base game; no item. start_with: open from the start, no item.
  # own_item: the "Sanji's Kitchen" item. sanji: having Sanji in the crew, no item. own_item_and_sanji:
  # the item and Sanji.
  # Options: vanilla, start_with, own_item, sanji, own_item_and_sanji
  kitchen_unlock: own_item

  # Sanji Is Required for Art of Cooking: Art of Cooking levels are only given once Sanji has joined the
  # crew (received items wait until then).
  # true / false
  sanji_required_for_art: false

  # Chopper's Pharmacy Unlock Condition: What opens Chopper's Pharmacy (compounding). vanilla: opens
  # after the first island boss you beat, like the base game; no item. start_with: open from the start,
  # no item. own_item: the "Chopper's Pharmacy" item. chopper: having Tony Tony Chopper in the crew, no
  # item. own_item_and_chopper: the item and Chopper.
  # Options: vanilla, start_with, own_item, chopper, own_item_and_chopper
  pharmacy_unlock: own_item

  # Chopper Is Required for Art of Compounding: Art of Compounding levels are only given once Tony Tony
  # Chopper has joined the crew (received items wait until then).
  # true / false
  chopper_required_for_art: false

  # Enable Franky's Supplies: Adds Franky's Supplies: the game's unused second Development menu,
  # repurposed as more Archipelago crafting recipes, paid mostly in Old Gold Coins (opened from the two
  # outside Storage spots on the Thousand Sunny; in the pause menu's Instructions, A in the Development
  # tab switches to Franky's list). Old Gold Coins also come from: the Flour / Hardtack Ration barrels,
  # the Golden Hercules (1-5, instead of Sticky Sap), fishing junk, the Cave Isle's Sea Anemones
  # (instead of Black Orbs) and the Thousand Sunny's dust spots (instead of random Orbs); they are
  # filler too. Franky's Supply skill is renamed "Art of Supplying" (and its item); each level unlocks
  # more of Franky's recipes, and it still lowers the materials Build Sites need.
  # true / false
  franky_supplies: true

  # Franky's Supplies Unlock Condition: What opens Franky's Supplies (does nothing without Enable
  # Franky's Supplies). start_with: open from the start, no item. own_item: the "Franky's Supplies"
  # item. franky: having Franky in the crew, no item. own_item_and_franky: the item and Franky.
  # Options: start_with, own_item, franky, own_item_and_franky
  franky_supplies_unlock: own_item

  # Franky Is Required for Art of Supplying: Art of Supplying levels are only given once Franky has
  # joined the crew (received items wait until then).
  # true / false
  franky_required_for_art: false

  # Extra Crafting Recipes: Fills the empty recipe slots of Usopp's Workshop (6), Sanji's Kitchen (11)
  # and Chopper's Pharmacy (15) with random recipes that make Archipelago Items ("<menu> - Extra Recipe
  # #n" locations).
  # true / false
  extra_crafting_recipes: true

  # Quick Fish & Creature Recipes: Development, cooking and compounding recipes need only 1 of each fish
  # or creature they use (e.g. Saury Full Course: 1 Shining Saury instead of 5; Special Item Bag: 1
  # Shark instead of 2). Sea King parts count too.
  # true / false
  quick_recipes: false

  # ---- Characters, Moves & Skills Options --------------------------------
  # Move EXP Multiplier: Moves gain levels faster: 2X to 5X move EXP (every per-level requirement
  # divided by 2, 3, 4 or 5).
  # Options: off, 2x, 3x, 4x, 5x
  move_exp_multiplier: off

  # Super Move Locations: Level 2-5 of each super move and co-op move are locations. off: no super / co-
  # op move locations. on: they can hold anything. unimportant: only useful items, filler or traps.
  # (Standard move levels 2-5 are always locations and can always hold progression.)
  # Options: off, on, unimportant
  super_move_locations: unimportant

  # Chopper & Brook Always Have Cold Resistance: Chopper and Brook always have Cold Resistance, as if
  # they had used an Anti-Cold Cream (cold areas stop SP from regenerating for everyone else).
  # true / false
  chopper_brook_cold_resistance: true

  # Nami Is Required for Treasure Maps: Treasure Map Fragments are only given once Nami has joined the
  # crew (received fragments wait until then).
  # true / false
  nami_required_for_maps: false

  # Robin Is Required for Stone Monuments: Stone Monuments can't be read (touching them does nothing)
  # until Nico Robin has joined the crew.
  # true / false
  robin_required_for_monuments: false

  # Franky Is Required for Build Sites: Build Sites stay locked (impossible cost) until Franky has
  # joined the crew and their Access item is found. Everything behind a Build Site (like the secret
  # boss) needs Franky as well.
  # true / false
  franky_required_for_build_sites: false

  # Nami's Cat Burglar Item Type: Whether "Nami - Progressive Cat Burglar" is a Useful or Progression
  # item (progression here is progression that skips balancing).
  # Options: useful, progression
  cat_burglar_item_type: useful

  # Robin's Flower Flower Power Item Type: Whether "Robin - Progressive Flower Flower Power" is a Useful
  # or Progression item (progression here is progression that skips balancing).
  # Options: useful, progression
  flower_power_item_type: useful

  # Brook's Light Weight Item Type: Whether "Brook - Progressive Light Weight" is a Useful or
  # Progression item (progression here is progression that skips balancing).
  # Options: useful, progression
  light_weight_item_type: useful

  # ---- Fishing & Bug-Catching Options ------------------------------------
  # Fishsanity: Catching each fish for the first time is a location. on: the locations can hold
  # anything. unimportant: only useful items, filler or traps.
  # Options: off, on, unimportant
  fishsanity: on

  # Creaturesanity: Catching each creature for the first time (Bug-Catcher Net) is a location. on: the
  # locations can hold anything. unimportant: only useful items, filler or traps.
  # Options: off, on, unimportant
  creaturesanity: on

  # How Many Fish Locations: How many fish locations there are, picked at random from the fish catchable
  # in this world.
  # Range: 1-20
  fish_locations: 20

  # How Many Creature Locations: How many creature locations there are, picked at random from the
  # creatures catchable in this world.
  # Range: 1-20
  creature_locations: 20

  # Combine Fishing Rod & Line Levels: No Rod Line items: each Rod Level item also raises the line level
  # by the same step (with 6 items of each, one Rod Level item = +5 rod and +5 line). Off: Rod Level and
  # Rod Line items are separate.
  # true / false
  combine_rod_and_line: false

  # Number of Rod Upgrade Items: How many Rod Level and Rod Line upgrade items there are (of each). 30:
  # every item is one level. 6: every item is five levels. 4: Rod: Fishing Rod max -> Whopper -> Sea
  # King -> MAX. Line: levels 8, 16, 23, 30.
  # Options: 30, 6, 4
  rod_upgrade_items: '30'

  # Equalise Fish Rates: Every fish that can bite at a fishing spot is equally likely (vanilla:
  # weighted, e.g. Shining Saury twice as likely as a Shark off the Thousand Sunny). Which fish can bite
  # still depends on how far the lure lands.
  # true / false
  equalise_fish_rates: false

  # Easier Fish: Fish pull 50% less hard while you reel them in.
  # true / false
  easier_fish: false

  # Better Traps: A set trap always catches something and keeps it until you check the trap, and catches
  # after 10 minutes of play; leaving the trap's area once (another zone, or off the Thousand Sunny)
  # finishes it straight away. What it catches is still random. (Vanilla: a trap has a random lifetime
  # of 30-50 minutes and is destroyed with its catch when that runs out; the catch takes 30-50 minutes,
  # and leaving the area takes 10 minutes off but never below 20.)
  # true / false
  better_traps: true

  # Guaranteed Creature Drops: Creatures caught with the Bug-Catcher Net always drop their item
  # (vanilla: 25-60% for many of them, such as Royal Jelly from Honey Bees and Doctor Hornets, or
  # Mystery Eggs from Seagulls).
  # true / false
  guaranteed_creature_drops: true

  # ---- Quality of Life Options -------------------------------------------
  # Crafting Recipes Are Discovered Through Arts: Development / Cooking / Compounding recipes only show
  # in their menu once the Art level needed to craft them has been received (rows need Art 0-3). Off:
  # every recipe is shown from the start. Purely visual: a recipe can't be crafted before its Art level
  # either way.
  # true / false
  recipes_discovered_through_arts: true

  # Crafting Recipes Spoil Locations: Recipe descriptions say which item (and whose) the recipe's
  # location holds. Off: they only say it holds an unclaimed Archipelago location.
  # true / false
  recipes_spoil_locations: true

  # Disable Diminishing Returns For Food: Feeding a Straw Hat the same food again always gives its full
  # stat gain (vanilla: the gain drops each time until it stops).
  # true / false
  disable_food_diminishing_returns: false

  # Iron Scrap Give Gold Energy: Feeding Gabri an Iron Scrap also gives 10 Gold Energy (vanilla: 15 Red,
  # 25 Black, no Gold).
  # true / false
  iron_scrap_gives_gold_energy: true

  # Wooded Isle Blue Orbs Digspots Give Pure Iron Ore: Every Blue Orb dig spot on the Wooded Isle gives
  # Pure Iron Ore instead, including the repeatable one next to the Thousand Sunny (the Wooded Isle Pure
  # Iron Ore spots can only be dug once).
  # true / false
  blue_orb_spot_gives_iron_ore: true

  # Better Random Dig Item Rates: Digging plain ground with the Pickaxe (no dig spot) finds a random dig
  # item (Clay, Handy Rock, or Ice Shard on snow / ice) 25% of the time instead of 5%. It's distance
  # based, not timed: a dig only counts when it's far enough from the last one, so wandering around
  # while digging is recommended.
  # true / false
  better_random_dig_item_rates: true

  # Better Plant Drop Rates: Bitter Grass, Medicinal Herbs and Nectar drop more often from their plants
  # (Bitter Grass / Medicinal Herbs / Nectar): normal hits 25% / 60% / 25% (vanilla 10% / 60% / 15%),
  # slash hits 50% / 80% / 50% (vanilla as normal hits), Vacuum Cleaner 75% / 100% / 75% (vanilla 30% /
  # 100% / 30%). The Pickaxe counts as a normal hit. Fire attacks burn them to Ashes 80% of the time
  # (vanilla 8-10%). The Cave Isle's Sea Lilies drop Mysterious Seaweed 80% of the time (vanilla 20%).
  # true / false
  better_plant_drop_rates: true

  # Expanded Storage: The Thousand Sunny's Storage has 45 slots instead of 35 (9 per row; the menu can't
  # show more). The 10 extra slots are kept by the client in the save's own data.
  # true / false
  expanded_storage: true

  # ---- Starting Costumes -------------------------------------------------
  # Each Straw Hat's outfit at the start of the game. Costumes can be changed later on at the Thousand
  # Sunny's wardrobes in the girls' dorm (open after Gecko Moria) once the Garment Box has been found.
  # Luffy: unlimited, unlimited_hat_on, thriller_bark, thriller_bark_hat_on
  luffy_starting_costume: unlimited
  # Zoro: unlimited, unlimited_bandana_on, thriller_bark, thriller_bark_bandana_on
  zoro_starting_costume: unlimited
  # Usopp: unlimited, unlimited_goggles_on, thriller_bark, thriller_bark_hat_off
  usopp_starting_costume: unlimited
  # Sanji: unlimited, unlimited_glasses_on, thriller_bark, thriller_bark_glasses_on
  sanji_starting_costume: unlimited
  # Nami: unlimited, unlimited_hair_down, thriller_bark, thriller_bark_hair_down
  nami_starting_costume: unlimited
  # Chopper: unlimited, thriller_bark
  chopper_starting_costume: unlimited
  # Robin: unlimited, unlimited_hat_on, thriller_bark
  robin_starting_costume: unlimited
  # Franky: unlimited, unlimited_shades_on, thriller_bark, thriller_bark_shades_on
  franky_starting_costume: unlimited
  # Brook: unlimited, thriller_bark
  brook_starting_costume: unlimited

  # ---- Filler & Trap Weighting Options -----------------------------------
  # Items Are Weighted Based on Quality: Stronger food and medicine is rarer in the filler pool. Off:
  # every food / medicine / other item is equally likely within its group.
  # true / false
  filler_quality_weighting: true

  # Include Bundle Filler: Small Packages (x3) and Large Packages (x5) of food, medicine and the
  # Kuwagata are in the filler pool.
  # true / false
  include_bundle_filler: true

  # Bundle Filler Is Weighted Based on Size: Bigger packages are rarer: Small Packages are half as
  # likely as the single item, Large ones a quarter. Off: packages are as likely as the single item.
  # Does nothing without Include Bundle Filler.
  # true / false
  bundle_size_weighting: true

  # Include Traps: Status traps are in the filler pool: Burn, Frozen, Poison, Paralysis, Sleep and Stun
  # Trap. A trap hits the Straw Hat you're controlling with that status (no damage), like an enemy
  # attack. Traps queue up and never play at the same time: the next one waits until the last one has
  # worn off. How many there are is set by Trap Filler Weight.
  # true / false
  include_traps: false

  # Food Filler Weight: How much of the filler is food (relative to Medicine and Other Filler Weight).
  # 0: no food filler.
  # Range: 0-100
  food_filler_weight: 64

  # Medicine Filler Weight: How much of the filler is medicine (relative to Food and Other Filler
  # Weight). 0: no medicine filler.
  # Range: 0-100
  medicine_filler_weight: 27

  # Other Filler Weight: How much of the filler is other items: the Kuwagata and the six Orbs (relative
  # to Food and Medicine Filler Weight). 0: none of them.
  # Range: 0-100
  other_filler_weight: 9

  # Trap Filler Weight: How much of the filler is traps (relative to Food, Medicine and Other Filler
  # Weight). Does nothing without Include Traps.
  # Range: 0-100
  trap_filler_weight: 10
